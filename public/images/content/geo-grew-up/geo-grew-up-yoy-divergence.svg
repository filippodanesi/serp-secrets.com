    <line x1="260" y1="0" x2="260" y2="210" stroke="#e5e5e5" stroke-width="0.5"/>
    <text x="260" y="228" font-size="10" fill="#a3a3a3" text-anchor="middle">0%</text>
    <line x1="340" y1="0" x2="340" y2="210" stroke="#e5e5e5" stroke-width="0.5"/>
    <text x="340" y="228" font-size="10" fill="#a3a3a3" text-anchor="middle">+100%</text>
    <line x1="420" y1="0" x2="420" y2="210" stroke="#e5e5e5" stroke-width="0.5"/>
    <text x="420" y="228" font-size="10" fill="#a3a3a3" text-anchor="middle">+200%</text>
    <line x1="500" y1="0" x2="500" y2="210" stroke="#e5e5e5" stroke-width="0.5"/>
    <text x="500" y="228" font-size="10" fill="#a3a3a3" text-anchor="middle">+300%</text>
    <line x1="580" y1="0" x2="580" y2="210" stroke="#e5e5e5" stroke-width="0.5"/>
    <text x="584" y="228" font-size="10" fill="#a3a3a3" text-anchor="end">+400%</text>
    <line x1="260" y1="0" x2="260" y2="210" stroke="#d4d4d4" stroke-width="1"/>
    <text x="174" y="18" font-size="11" fill="#171717" text-anchor="end">GEO tools</text>
    <rect x="260" y="6" width="300.8" height="20" rx="2" fill="#171717"/>
    <text x="554.8" y="20" font-size="11" font-weight="600" fill="#ffffff" text-anchor="end">+376%</text>
    <text x="174" y="60" font-size="11" fill="#171717" text-anchor="end">GEO agency</text>
    <rect x="260" y="48" width="268.8" height="20" rx="2" fill="#171717"/>
    <text x="522.8" y="62" font-size="11" font-weight="600" fill="#ffffff" text-anchor="end">+336%</text>
    <text x="174" y="102" font-size="11" fill="#171717" text-anchor="end">GEO services</text>
    <rect x="260" y="90" width="100.8" height="20" rx="2" fill="#171717"/>
    <text x="354.8" y="104" font-size="11" font-weight="600" fill="#ffffff" text-anchor="end">+126%</text>
    <text x="174" y="144" font-size="11" fill="#171717" text-anchor="end">what is GEO</text>
    <rect x="260" y="132" width="96.0" height="20" rx="2" fill="#171717"/>
    <text x="350.0" y="146" font-size="11" font-weight="600" fill="#ffffff" text-anchor="end">+120%</text>
    <text x="174" y="181" font-size="10" fill="#171717" text-anchor="end">generative engine</text>
    <text x="174" y="193" font-size="10" fill="#171717" text-anchor="end">optimization</text>
    <rect x="233.6" y="174" width="26.4" height="20" rx="2" fill="#a3a3a3"/>
    <text x="227.6" y="188" font-size="11" font-weight="600" fill="#a3a3a3" text-anchor="end">-33%</text>
