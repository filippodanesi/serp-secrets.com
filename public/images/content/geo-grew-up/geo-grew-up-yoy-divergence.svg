<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="48" y="36" font-size="11" font-weight="500" letter-spacing="0.05em" fill="#737373">THE SHAPE OF A MATURING MARKET</text>
  <text x="48" y="58" font-size="15" font-weight="500" fill="#171717">GEO search demand, year over year</text>
  <g transform="translate(48, 80)">
